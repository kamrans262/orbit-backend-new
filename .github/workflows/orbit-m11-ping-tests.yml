name: Orbit Ping focused Laravel verification
on:
  push:
    branches: [feature/m9-presence-backend-admin]
    paths:
      - '.github/workflows/orbit-m11-ping-tests.yml'
      - 'app/Modules/Ping/**'
      - 'config/orbit_ping.php'
      - 'config/orbit_circle.php'
      - 'database/migrations/2026_10_30_000001_create_orbit_pings.php'
      - 'routes/api.php'
      - 'routes/admin.php'
      - 'tests/Feature/OrbitPing*.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: orbit_ci
          MARIADB_USER: orbit_ci
          MARIADB_PASSWORD: orbit_ci_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: orbit_ci
      DB_USERNAME: orbit_ci
      DB_PASSWORD: orbit_ci_pass
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, openssl, sodium
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure disposable test database
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Syntax of Ping surfaces only
        run: |
          find app/Modules/Ping -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l config/orbit_ping.php
          php -l database/migrations/2026_10_30_000001_create_orbit_pings.php
          for file in tests/Feature/OrbitPing*.php; do php -l "$file"; done
          php -l routes/api.php
          php -l routes/admin.php
      - name: Ping authorization, delivery, consent and rate limit tests
        run: php artisan test --compact --filter='OrbitPingTest|OrbitPingCircleTest|OrbitPingConsentTest'
