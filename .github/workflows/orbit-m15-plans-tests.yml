name: Orbit M15 Plans Backend and Admin verification
on:
  push:
    branches: [feature/m15-plans-backend-admin-2026-11-10]
    paths:
      - '.github/workflows/orbit-m15-plans-tests.yml'
      - 'app/Modules/Plans/**'
      - 'app/Modules/Notifications/Services/NotificationPolicy.php'
      - 'app/Modules/Notifications/Services/NotificationService.php'
      - 'config/orbit_plans.php'
      - 'config/orbit_circle.php'
      - 'config/orbit_notifications.php'
      - 'database/migrations/2026_11_10_*.php'
      - 'resources/views/orbit-admin/plans.blade.php'
      - 'resources/views/orbit-admin/partials/**'
      - 'routes/api.php'
      - 'routes/admin.php'
      - 'routes/console.php'
      - 'tests/Feature/OrbitM15PlansTest.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plans:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: orbit_ci
          MARIADB_USER: orbit_ci
          MARIADB_PASSWORD: orbit_ci_pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: orbit_ci
      DB_USERNAME: orbit_ci
      DB_PASSWORD: orbit_ci_pass
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, openssl, sodium
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure disposable test database
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: PHP syntax validation
        run: |
          find app/Modules/Plans -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l app/Modules/Notifications/Services/NotificationPolicy.php
          php -l app/Modules/Notifications/Services/NotificationService.php
          php -l config/orbit_plans.php
          php -l config/orbit_circle.php
          php -l config/orbit_notifications.php
          php -l database/migrations/2026_11_10_000001_create_orbit_plans.php
          php -l routes/api.php
          php -l routes/admin.php
          php -l routes/console.php
          php -l tests/Feature/OrbitM15PlansTest.php
      - name: Verify route and migration contracts
        run: |
          php artisan route:list --path=api/v1/plans
          php artisan route:list --path=admin/plans
          php artisan migrate --force
      - name: Isolated M15 rollback and reapply preserves M1-M14 tables
        run: |
          php artisan migrate:rollback --force --path=database/migrations/2026_11_10_000001_create_orbit_plans.php
          php artisan tinker --execute='if(\Illuminate\Support\Facades\Schema::hasTable("plans") || !\Illuminate\Support\Facades\Schema::hasTable("notification_events")) throw new RuntimeException("M15 rollback boundary failed"); echo "M14 notification tables preserved".PHP_EOL;'
          php artisan migrate --force --path=database/migrations/2026_11_10_000001_create_orbit_plans.php
          php artisan tinker --execute='if(!\Illuminate\Support\Facades\Schema::hasTable("plans") || !\Illuminate\Support\Facades\Schema::hasTable("notification_events")) throw new RuntimeException("M15 reapply failed"); echo "M15 reapply OK".PHP_EOL;'
      - name: Module 15 focused API and Admin tests
        run: php artisan test --compact --filter='OrbitM15PlansTest'
      - name: Existing M3-M5 M8 M14 regression tests
        run: |
          php artisan test --compact \
            tests/Feature/OrbitM3ErasureTest.php \
            tests/Feature/OrbitM4SocialGraphTest.php \
            tests/Feature/OrbitM5CirclesTest.php \
            tests/Feature/OrbitM8DashboardTest.php \
            tests/Feature/OrbitM14NotificationsTest.php
