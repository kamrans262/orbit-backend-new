name: Orbit Laravel validation (M1 + M2 + M3 + Admin UI)
on:
  pull_request:
    branches: [main, feature/m1-foundation-config, feature/m2-auth-identity, feature/m3-profiles-settings, feature/m3-admin-console, feature/admin-ui-layout-polish, feature/m3-completion-erasure]
  push:
    branches: [feature/m1-foundation-config, feature/m2-auth-identity, feature/m3-profiles-settings, feature/m3-admin-console, feature/admin-ui-layout-polish]
jobs:
  php-tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: orbit_ci
          MARIADB_USER: orbit_ci
          MARIADB_PASSWORD: orbit_ci_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: orbit_ci
      DB_USERNAME: orbit_ci
      DB_PASSWORD: orbit_ci_pass
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, openssl, sodium
          tools: composer:v2
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate a test-only application key
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: PHP syntax
        run: |
          find app routes database/migrations tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Laravel unit and integration tests
        run: php artisan test
