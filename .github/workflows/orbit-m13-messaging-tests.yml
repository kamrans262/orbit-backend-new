name: Orbit M13 focused ciphertext messaging verification
on:
  push:
    branches: [feature/m9-presence-backend-admin]
    paths:
      - '.github/workflows/orbit-m13-messaging-tests.yml'
      - 'app/Modules/Messaging/**'
      - 'config/orbit_messaging.php'
      - 'database/migrations/2026_10_30_000004_create_orbit_messaging.php'
      - 'tests/Feature/OrbitMessagingTest.php'
      - 'routes/api.php'
      - 'routes/admin.php'
      - 'config/orbit_circle.php'
      - 'resources/views/orbit-admin/messaging.blade.php'
      - 'resources/views/orbit-admin/partials/sidebar-navigation.blade.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  messaging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: orbit_ci
          MARIADB_USER: orbit_ci
          MARIADB_PASSWORD: orbit_ci_pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: orbit_ci
      DB_USERNAME: orbit_ci
      DB_PASSWORD: orbit_ci_pass
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, openssl, sodium
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure disposable messaging test database
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint only M13 and directly changed integration files
        run: |
          find app/Modules/Messaging -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l config/orbit_messaging.php
          php -l config/orbit_circle.php
          php -l database/migrations/2026_10_30_000004_create_orbit_messaging.php
          php -l routes/api.php
          php -l routes/admin.php
          php -l tests/Feature/OrbitMessagingTest.php
      - name: Focused encrypted messaging, consent and Admin tests
        run: php artisan test --compact --filter='OrbitMessagingTest'
