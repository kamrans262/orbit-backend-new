name: Orbit M18 Activity Laravel and Admin verification
on:
  push:
    branches: [feature/m18-activity-backend-admin-2026-11-24]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: orbit_ci
          MARIADB_USER: orbit_ci
          MARIADB_PASSWORD: orbit_ci_pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: true
      # Static dummy key for disposable CI only; never use for production.
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: orbit_ci
      DB_USERNAME: orbit_ci
      DB_PASSWORD: orbit_ci_pass
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, openssl, sodium
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify PHP syntax, registered routes and additive migration
        run: |
          find app/Modules/Activity -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l database/migrations/2026_11_24_000001_create_orbit_m18_activity.php
          php -l database/migrations/2026_11_24_000002_extend_m18_activity_admin_audits.php
          php -l config/orbit_activity.php
          php -l routes/api.php
          php -l routes/admin.php
          php -l routes/console.php
          php -l tests/Feature/OrbitM18ActivityTest.php
          php artisan route:list --path=api/v1/activity
          php artisan route:list --path=admin/activity
          php artisan migrate --force
      - name: Verify M18 rollback preserves M1-M17 source data
        run: |
          php artisan migrate:rollback --force --path=database/migrations/2026_11_24_000002_extend_m18_activity_admin_audits.php
          php artisan migrate:rollback --force --path=database/migrations/2026_11_24_000001_create_orbit_m18_activity.php
          php artisan tinker --execute='if(\Illuminate\Support\Facades\Schema::hasTable("activity_events") || !\Illuminate\Support\Facades\Schema::hasTable("moments") || !\Illuminate\Support\Facades\Schema::hasTable("checkins") || !\Illuminate\Support\Facades\Schema::hasTable("moderation_cases")) throw new RuntimeException("M18 rollback is unsafe");'
          php artisan migrate --force --path=database/migrations/2026_11_24_000001_create_orbit_m18_activity.php
          php artisan migrate --force --path=database/migrations/2026_11_24_000002_extend_m18_activity_admin_audits.php
      - name: Activity ACL, pagination, privacy and admin permissions
        run: php artisan test --compact tests/Feature/OrbitM18ActivityTest.php
      - name: M4 M5 M7 M12 M13 M14 M15 M16 M17 regression
        run: |
          php artisan test --compact \
            tests/Feature/OrbitM4SocialGraphTest.php \
            tests/Feature/OrbitM5CirclesTest.php \
            tests/Feature/OrbitM7MomentsTest.php \
            tests/Feature/OrbitCheckInTest.php \
            tests/Feature/OrbitMessagingTest.php \
            tests/Feature/OrbitM14NotificationsTest.php \
            tests/Feature/OrbitM15PlansTest.php \
            tests/Feature/OrbitM16SosSafetyTest.php \
            tests/Feature/OrbitM17ModerationTest.php
